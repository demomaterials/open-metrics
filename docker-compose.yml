# Local development stack:  docker compose up --build   →  http://localhost:8088
# Sign in as admin / ${ADMIN_PASSWORD:-change-me-please}
name: open-metrics

x-db-env: &db-env
  DB_HOST: db
  DB_NAME: metrics
  DB_USER: metrics_app
  DB_PASSWORD: ${APP_DB_PASSWORD:-metrics-app-dev}
  DB_SSLMODE: disable

x-app-env: &app-env
  <<: *db-env
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-dev-only-encryption-key-change-me}
  COOKIE_SECURE: "false"
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
  SEED_DEMO: "true"
  SAMPLE_SOURCE_HOST: db
  SAMPLE_SOURCE_PASSWORD: ${READER_DB_PASSWORD:-metrics-reader-dev}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-metrics-app-dev}
      READER_DB_PASSWORD: ${READER_DB_PASSWORD:-metrics-reader-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/helm/metrics-db/files/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ./deploy/compose/initdb.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "metrics"]
      interval: 3s
      retries: 30

  migrate:
    build: ./backend
    image: open-metrics-backend:dev
    command: ["python", "-m", "app.cli", "init"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  backend:
    image: open-metrics-backend:dev
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 5s
      retries: 20

  frontend:
    build: ./frontend
    image: open-metrics-frontend:dev
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["8088:8080"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
