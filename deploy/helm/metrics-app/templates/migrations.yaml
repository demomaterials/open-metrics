{{- if .Values.migrations.enabled }}
# Schema migrations + first-run bootstrap, before the new backend rolls out.
# Runs as a pre-install/pre-upgrade hook so `helm --wait` never waits on pods
# whose schema does not exist yet. Alembic takes an advisory lock, so a
# concurrent run is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: metrics-migrate
  labels: {{- include "metrics.labels" (dict "root" . "name" "metrics-migrate" "component" "migrations") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {{- include "metrics.labels" (dict "root" . "name" "metrics-migrate" "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "metrics.imagePullSecrets" . | nindent 6 }}
      {{- include "metrics.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ .Values.images.backend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "-m", "app.cli", "init"]
          env:
            {{- range $k, $v := (include "metrics.config" . | fromYaml) }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- include "metrics.secretEnv" . | nindent 12 }}
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.app }}, key: ADMIN_PASSWORD } }
            {{- if .Values.sampleSource.enabled }}
            - name: SAMPLE_SOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.db }}, key: READER_DB_PASSWORD, optional: true } }
            {{- end }}
          {{- include "metrics.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
