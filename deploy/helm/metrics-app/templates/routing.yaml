{{- $backends := list (dict "prefix" "/api" "svc" "metrics-backend") (dict "prefix" "/" "svc" "metrics-frontend") }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-metrics
  labels: {{- include "metrics.labels" (dict "root" . "name" "open-metrics" "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.hostname | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.hostname | quote }}
      http:
        paths:
          {{- range $backends }}
          - path: {{ .prefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ .svc }}
                port: { name: http }
          {{- end }}
---
{{- end }}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-metrics
  labels: {{- include "metrics.labels" (dict "root" . "name" "open-metrics" "component" "route") | nindent 4 }}
spec:
  parentRefs:
    {{- if .Values.gateway.create }}
    - name: {{ .Values.gateway.name }}
      sectionName: https
    {{- end }}
    {{- with .Values.httpRoute.parentRefs }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  hostnames: [{{ .Values.hostname | quote }}]
  rules:
    {{- range $backends }}
    - matches:
        - path: { type: PathPrefix, value: {{ .prefix }} }
      timeouts:
        request: 60s
      backendRefs:
        - name: {{ .svc }}
          port: 8080
    {{- end }}
{{- end }}
