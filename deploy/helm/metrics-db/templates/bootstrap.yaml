{{- if .Values.bootstrap.enabled }}
# files/bootstrap.sql is idempotent: the Job runs after every install/upgrade
# and (re)applies role passwords from the credentials Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-db-bootstrap
  labels: {{- include "metricsdb.labels" . | nindent 4 }}
data:
  bootstrap.sql: |
{{ .Files.Get "files/bootstrap.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: metrics-db-bootstrap
  labels: {{- include "metricsdb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    checksum/sql: {{ .Files.Get "files/bootstrap.sql" | sha256sum }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-db-bootstrap
        app.kubernetes.io/part-of: open-metrics
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 70
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: psql
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: PGHOST, value: {{ .Values.serviceName | quote }} }
            - { name: PGPORT, value: {{ .Values.port | quote }} }
            - { name: PGUSER, value: postgres }
            - { name: PGDATABASE, value: postgres }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: POSTGRES_PASSWORD } }
            - name: APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: APP_DB_PASSWORD } }
            - name: READER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.credentialsSecret }}, key: READER_DB_PASSWORD } }
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -q -v app_password="$APP_DB_PASSWORD" -v reader_password="$READER_DB_PASSWORD" -f /sql/bootstrap.sql
              echo "bootstrap applied"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: sql, mountPath: /sql, readOnly: true }
      volumes:
        - name: sql
          configMap: { name: metrics-db-bootstrap }
{{- end }}
